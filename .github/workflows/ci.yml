name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# No implicit -e or pipefail: every command checks its own status.
defaults:
  run:
    shell: bash --noprofile --norc {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A go.work must never change what CI tests.
  GOWORK: "off"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Install test tools
        run: |
          sudo apt-get update || exit 1
          sudo systemctl mask --runtime nginx.service apache2.service || exit 1
          sudo apt-get install -y bubblewrap nginx apache2 zstd || exit 1
      - name: Allow test namespaces on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || exit 1
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .) || exit 1
          printf '%s\n' "$unformatted" || exit 1
          test -z "$unformatted" || exit 1
      - name: Vet
        run: |
          go vet ./... || exit 1
          go vet -tags=proxyintegration ./... || exit 1
      - name: Cyclomatic complexity
        run: go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -over 15 -ignore '_test\.go$' . || exit 1
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --build-tags=proxyintegration
      - name: Race tests
        run: go test -race -count=1 ./... || exit 1
      - name: Sandbox tests with a real bwrap
        run: COMFYWARE_SANDBOX_TEST=1 go test -race -count=1 ./... || exit 1
      - name: Real nginx and Apache proxy tests
        run: go test -tags=proxyintegration -count=1 -timeout=60s ./proxyconfig/proxytest || exit 1
      - name: Fuzz smoke
        run: sh tools/fuzz.sh 10s || exit 1
      - name: Mutation engine self-test
        run: python3 tools/test_mutate.py || exit 1
      - name: Mutations
        run: python3 tools/mutate.py mutations/*.json || exit 1

# Include inside nginx's http block. See docs/reverse-proxies.md.
# Replace the hostname and certificate paths with your own.
server {
	listen 80;
	listen [::]:80;
	server_name app.example.org;
	return 308 https://app.example.org$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name app.example.org;
	ssl_certificate /etc/letsencrypt/live/app.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/app.example.org/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	# This caps the whole multipart request, including all files and overhead.
	client_max_body_size 64m;
	client_body_timeout 300s;
	send_timeout 300s;

	location / {
		proxy_pass http://127.0.0.1:8082;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $http_host;
		# Replace incoming values; never append an untrusted client's headers.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header Forwarded "";
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_cache off;
		proxy_connect_timeout 5s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;
	}
}
